<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מטרונום מקצועי + אימון קצב</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --panel-bg: #141414;
            --primary: #00e676;
            --primary-hover: #00c853;
            --accent: #ff5252;
            --warning: #ffb74d;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .metronome-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* אינדיקטור ויזואלי לפעימה */
        .visual-beat-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            height: 24px;
            align-items: center;
        }

        .beat-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #333;
            transition: transform 0.04s ease, background-color 0.04s ease;
        }

        .beat-dot.active-main {
            background-color: var(--accent);
            transform: scale(1.4);
            box-shadow: 0 0 12px var(--accent);
        }

        .beat-dot.active-sub {
            background-color: var(--primary);
            transform: scale(1.2);
            box-shadow: 0 0 10px var(--primary);
        }

        /* תצוגת BPM */
        .bpm-display {
            margin-bottom: 16px;
        }

        .bpm-value {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .bpm-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* שליטה ב-BPM */
        .bpm-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            user-select: none;
        }

        .btn-circle:hover {
            background-color: #3a3a3a;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
            cursor: pointer;
            height: 6px;
            background: #333;
            border-radius: 4px;
        }

        /* חלוקות קצב - Subdivisions */
        .section-block {
            margin-bottom: 22px;
            text-align: right;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            text-align: center;
        }

        .subdivision-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background-color: var(--panel-bg);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .sub-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 2px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .sub-btn.active {
            background-color: var(--primary);
            color: #000000;
        }

        /* תבניות BPM שמורות - Presets */
        .presets-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 22px;
        }

        .preset-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .preset-input {
            flex: 1;
            background-color: #252525;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            text-align: center;
        }

        .preset-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-add-preset {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add-preset:hover {
            background-color: #353535;
        }

        .presets-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .preset-chip {
            display: inline-flex;
            align-items: center;
            background-color: #262626;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .preset-chip:hover {
            border-color: var(--primary);
        }

        .preset-apply-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .preset-apply-btn:hover {
            color: var(--primary);
        }

        .preset-del-btn {
            background: transparent;
            border: none;
            border-right: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .preset-del-btn:hover {
            color: var(--accent);
            background-color: rgba(255, 82, 82, 0.1);
        }

        /* אימון העלאת מהירות אוטומטי - Speed Trainer */
        .trainer-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 22px;
            text-align: right;
        }

        .trainer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trainer-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .trainer-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .trainer-status {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: var(--warning);
            display: none;
            justify-content: space-between;
            align-items: center;
        }

        .trainer-status.visible {
            display: flex;
        }

        /* מתג הפעלה (Toggle Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 24px;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider-toggle {
            background-color: var(--primary);
        }

        input:checked + .slider-toggle:before {
            transform: translateX(20px);
            background-color: #000;
        }

        /* כפתור הפעלה ראשי */
        .play-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background-color: var(--primary);
            color: #000000;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 22px;
        }

        .play-btn:hover {
            background-color: var(--primary-hover);
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        .play-btn.playing {
            background-color: var(--accent);
            color: #ffffff;
        }

        /* שעון עצר - Stopwatch */
        .timer-section {
            border-top: 1px solid var(--border-color);
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-info {
            text-align: right;
        }

        .timer-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        .timer-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-small:hover {
            background-color: #3a3a3a;
        }
    </style>
</head>
<body>

<div class="metronome-card">
    <!-- תצוגה ויזואלית של החלוקות -->
    <div class="visual-beat-container" id="visual-container">
        <div class="beat-dot" id="dot-0"></div>
    </div>

    <!-- תצוגת BPM -->
    <div class="bpm-display">
        <div class="bpm-value" id="bpm-val">120</div>
        <div class="bpm-label">BPM</div>
    </div>

    <!-- שליטה במהירות -->
    <div class="bpm-controls">
        <button class="btn-circle" id="bpm-down" title="הורד BPM">-</button>
        <input type="range" id="bpm-slider" min="30" max="260" value="120">
        <button class="btn-circle" id="bpm-up" title="העלה BPM">+</button>
    </div>

    <!-- בחירת חלוקת קצב -->
    <div class="section-block">
        <span class="section-title">חלוקת פעימה (Subdivision)</span>
        <div class="subdivision-group">
            <button class="sub-btn active" data-sub="1">רבעים (1/4)</button>
            <button class="sub-btn" data-sub="2">שמיניות (1/8)</button>
            <button class="sub-btn" data-sub="4">שש-עשריות (1/16)</button>
            <button class="sub-btn" data-sub="8">32-יות (1/32)</button>
        </div>
    </div>

    <!-- תבניות מהירות - Presets -->
    <div class="presets-box">
        <span class="section-title" style="margin-bottom: 8px;">תבניות מהירות (Presets)</span>
        <div class="preset-input-row">
            <input type="number" id="preset-bpm-input" class="preset-input" placeholder="הזן BPM (למשל 56)" min="30" max="260">
            <button class="btn-add-preset" id="add-preset-btn">+ שמור תבנית</button>
        </div>
        <div class="presets-list" id="presets-list"></div>
    </div>

    <!-- אימון העלאת קצב אוטומטית - Speed Trainer -->
    <div class="trainer-box">
        <div class="trainer-header">
            <div>
                <div class="trainer-title">אימון קצב מדורג (Speed Trainer)</div>
                <div class="trainer-desc">מעלה אוטומטית ב-5 BPM כל 2 תיבות (8 רבעים)</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="trainer-toggle">
                <span class="slider-toggle"></span>
            </label>
        </div>
        <div class="trainer-status" id="trainer-status">
            <span>התקדמות ל-5 BPM הבאים:</span>
            <strong id="trainer-beat-counter">0 / 8 רבעים</strong>
        </div>
    </div>

    <!-- כפתור התחלה / עצירה -->
    <button class="play-btn" id="play-toggle">התחל ניגון</button>

    <!-- שעון עצר לזמן אימון -->
    <div class="timer-section">
        <div class="timer-info">
            <span class="timer-label">זמן אימון מצטבר</span>
            <span class="timer-display" id="stopwatch">00:00:00</span>
        </div>
        <div class="timer-actions">
            <button class="btn-small" id="timer-toggle">השהה שעון</button>
            <button class="btn-small" id="timer-reset">איפוס</button>
        </div>
    </div>
</div>

<script>
    // משתני שמע ותזמון - Web Audio API
    let audioCtx = null;
    let isPlaying = false;
    let bpm = 120;
    let subdivision = 1; // 1 = רבעים, 2 = שמיניות, 4 = שש-עשריות, 8 = 32-יות
    let currentSubStep = 0;
    let nextNoteTime = 0.0;
    let timerID = null;

    // הגדרות Lookahead לתזמון מדויק ברמת החומרה
    const lookahead = 25.0; // תדירות בדיקה במילישניות
    const scheduleAheadTime = 0.1; // כמה זמן קדימה לתזמן בשניות

    // אלמנטים מה-DOM
    const bpmValDisplay = document.getElementById('bpm-val');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDownBtn = document.getElementById('bpm-down');
    const bpmUpBtn = document.getElementById('bpm-up');
    const subButtons = document.querySelectorAll('.sub-btn');
    const playToggleBtn = document.getElementById('play-toggle');
    const visualContainer = document.getElementById('visual-container');

    // משתני תבניות (Presets)
    const presetInput = document.getElementById('preset-bpm-input');
    const addPresetBtn = document.getElementById('add-preset-btn');
    const presetsList = document.getElementById('presets-list');
    // טעינת תבניות שמורות או ברירת מחדל הכוללת 56 BPM
    let savedPresets = JSON.parse(localStorage.getItem('metronome_presets')) || [56, 80, 100, 120];

    // משתני אימון קצב מדורג (Speed Trainer)
    const trainerToggle = document.getElementById('trainer-toggle');
    const trainerStatus = document.getElementById('trainer-status');
    const trainerBeatCounter = document.getElementById('trainer-beat-counter');
    let isTrainerActive = false;
    let mainBeatsCompleted = 0;
    const BEATS_PER_INCREMENT = 8; // כל 8 רבעים (2 תיבות של 4/4)

    // משתני שעון עצר
    const stopwatchDisplay = document.getElementById('stopwatch');
    const timerToggleBtn = document.getElementById('timer-toggle');
    const timerResetBtn = document.getElementById('timer-reset');
    let elapsedSeconds = 0;
    let stopwatchInterval = null;
    let isStopwatchRunning = false;

    // --- ניהול תבניות (Presets) ---
    function savePresetsToStorage() {
        localStorage.setItem('metronome_presets', JSON.stringify(savedPresets));
    }

    function renderPresets() {
        presetsList.innerHTML = '';
        savedPresets.sort((a, b) => a - b).forEach(presetBpm => {
            const chip = document.createElement('div');
            chip.className = 'preset-chip';

            const applyBtn = document.createElement('button');
            applyBtn.className = 'preset-apply-btn';
            applyBtn.textContent = `${presetBpm} BPM`;
            applyBtn.title = 'לחץ למעבר מיידי למהירות זו';
            applyBtn.addEventListener('click', () => {
                setBPM(presetBpm);
                mainBeatsCompleted = 0;
                updateTrainerUI();
            });

            const delBtn = document.createElement('button');
            delBtn.className = 'preset-del-btn';
            delBtn.textContent = '✕';
            delBtn.title = 'מחק תבנית';
            delBtn.addEventListener('click', () => {
                savedPresets = savedPresets.filter(item => item !== presetBpm);
                savePresetsToStorage();
                renderPresets();
            });

            chip.appendChild(applyBtn);
            chip.appendChild(delBtn);
            presetsList.appendChild(chip);
        });
    }

    addPresetBtn.addEventListener('click', () => {
        const val = parseInt(presetInput.value);
        if (!isNaN(val) && val >= 30 && val <= 260) {
            if (!savedPresets.includes(val)) {
                savedPresets.push(val);
                savePresetsToStorage();
                renderPresets();
            }
            presetInput.value = '';
        }
    });

    presetInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            addPresetBtn.click();
        }
    });

    // --- ניהול אימון קצב מדורג (Speed Trainer) ---
    function updateTrainerUI() {
        trainerBeatCounter.textContent = `${mainBeatsCompleted} / ${BEATS_PER_INCREMENT} רבעים`;
    }

    trainerToggle.addEventListener('change', (e) => {
        isTrainerActive = e.target.checked;
        mainBeatsCompleted = 0;
        if (isTrainerActive) {
            trainerStatus.classList.add('visible');
            updateTrainerUI();
        } else {
            trainerStatus.classList.remove('visible');
        }
    });

    // --- ניהול חיווי ויזואלי ---
    function renderVisualDots() {
        visualContainer.innerHTML = '';
        for (let i = 0; i < subdivision; i++) {
            const dot = document.createElement('div');
            dot.className = 'beat-dot';
            dot.id = `dot-${i}`;
            visualContainer.appendChild(dot);
        }
    }

    function updateVisualIndicator(step) {
        const dots = document.querySelectorAll('.beat-dot');
        dots.forEach(d => {
            d.classList.remove('active-main', 'active-sub');
        });

        const activeDot = document.getElementById(`dot-${step}`);
        if (activeDot) {
            if (step === 0) {
                activeDot.classList.add('active-main');
            } else {
                activeDot.classList.add('active-sub');
            }
        }
    }

    // --- מנוע שמע (Web Audio API) ---
    function playClick(time, isMainBeat) {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.frequency.value = isMainBeat ? 1000 : 650;
        
        // מעטפת קצרה במיוחד (25ms) כדי שגם 32-יות במהירות גבוהה יישמעו חדות וברורות
        gainNode.gain.setValueAtTime(1, time);
        gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.025);

        osc.start(time);
        osc.stop(time + 0.025);
    }

    function nextNote() {
        const secondsPerBeat = 60.0 / bpm;
        const secondsPerSubdivision = secondsPerBeat / subdivision;
        nextNoteTime += secondsPerSubdivision;

        currentSubStep++;
        if (currentSubStep >= subdivision) {
            currentSubStep = 0;
        }
    }

    function scheduleNote(stepNumber, time) {
        const isMainBeat = (stepNumber === 0);
        playClick(time, isMainBeat);

        const delay = (time - audioCtx.currentTime) * 1000;
        setTimeout(() => {
            if (!isPlaying) return;
            updateVisualIndicator(stepNumber);

            // בדיקת התקדמות באימון קצב מדורג בכל פעימת רבע (Main Beat)
            if (isMainBeat && isTrainerActive) {
                mainBeatsCompleted++;
                if (mainBeatsCompleted >= BEATS_PER_INCREMENT) {
                    mainBeatsCompleted = 0;
                    setBPM(bpm + 5);
                }
                updateTrainerUI();
            }
        }, Math.max(0, delay));
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
            scheduleNote(currentSubStep, nextNoteTime);
            nextNote();
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    function toggleMetronome() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        isPlaying = !isPlaying;

        if (isPlaying) {
            currentSubStep = 0;
            mainBeatsCompleted = 0;
            updateTrainerUI();
            nextNoteTime = audioCtx.currentTime + 0.05;
            scheduler();
            playToggleBtn.textContent = 'עצור';
            playToggleBtn.classList.add('playing');
            
            if (!isStopwatchRunning) {
                startStopwatch();
            }
        } else {
            clearTimeout(timerID);
            playToggleBtn.textContent = 'התחל ניגון';
            playToggleBtn.classList.remove('playing');
            document.querySelectorAll('.beat-dot').forEach(d => {
                d.classList.remove('active-main', 'active-sub');
            });
            stopStopwatch();
        }
    }

    function setBPM(newBpm) {
        bpm = Math.min(260, Math.max(30, newBpm));
        bpmValDisplay.textContent = bpm;
        bpmSlider.value = bpm;
    }

    // מאזינים
    bpmSlider.addEventListener('input', (e) => setBPM(parseInt(e.target.value)));
    bpmDownBtn.addEventListener('click', () => setBPM(bpm - 1));
    bpmUpBtn.addEventListener('click', () => setBPM(bpm + 1));

    subButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            subButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            subdivision = parseInt(btn.getAttribute('data-sub'));
            currentSubStep = 0;
            renderVisualDots();
        });
    });

    playToggleBtn.addEventListener('click', toggleMetronome);

    // --- שעון עצר (Stopwatch) ---
    function formatTime(totalSeconds) {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;
        return [hrs, mins, secs]
            .map(v => v < 10 ? "0" + v : v)
            .join(":");
    }

    function startStopwatch() {
        if (isStopwatchRunning) return;
        isStopwatchRunning = true;
        timerToggleBtn.textContent = 'השהה שעון';
        stopwatchInterval = setInterval(() => {
            elapsedSeconds++;
            stopwatchDisplay.textContent = formatTime(elapsedSeconds);
        }, 1000);
    }

    function stopStopwatch() {
        isStopwatchRunning = false;
        timerToggleBtn.textContent = 'המשך שעון';
        clearInterval(stopwatchInterval);
    }

    timerToggleBtn.addEventListener('click', () => {
        if (isStopwatchRunning) {
            stopStopwatch();
        } else {
            startStopwatch();
        }
    });

    timerResetBtn.addEventListener('click', () => {
        stopStopwatch();
        elapsedSeconds = 0;
        stopwatchDisplay.textContent = '00:00:00';
        timerToggleBtn.textContent = 'הפעל שעון';
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            toggleMetronome();
        }
    });

    // אתחול ראשוני
    renderVisualDots();
    renderPresets();
</script>

</body>
</html>
